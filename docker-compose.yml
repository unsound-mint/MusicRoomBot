services:
  bot:
    build:
      context: .
    restart: unless-stopped
    dns:
      - ${DOCKER_DNS_PRIMARY:-1.1.1.1}
      - ${DOCKER_DNS_SECONDARY:-8.8.8.8}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-musicroom}:${POSTGRES_PASSWORD:-musicroom}@postgres:5432/${POSTGRES_DB:-musicroom}
      TIMEZONE: ${TIMEZONE:-Asia/Almaty}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    dns:
      - ${DOCKER_DNS_PRIMARY:-1.1.1.1}
      - ${DOCKER_DNS_SECONDARY:-8.8.8.8}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musicroom}
      POSTGRES_USER: ${POSTGRES_USER:-musicroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicroom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
